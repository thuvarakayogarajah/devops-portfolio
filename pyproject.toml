[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-portfolio"
version = "0.1.0"
description = "A small command-line program for the CDS212 DevOps module at FH Graubünden."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.0",
    "gunicorn>=26.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
devops-portfolio = "devops_portfolio.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
